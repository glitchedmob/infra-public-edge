apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 10m
  chart:
    spec:
      chart: external-secrets
      version: 2.6.0
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: external-secrets
  install:
    createNamespace: true
  values:
    installCRDs: true
    genericTargets:
      enabled: true
    extraArgs:
      unsafe-allow-generic-targets: "true"
    serviceAccount:
      name: external-secrets
      annotations:
        infra.levizitting.com/aws-role-arn: "arn:aws:iam::${AWS_ACCOUNT_ID}:role/public-edge/external-secrets"
    replicaCount: 1
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 64Mi
