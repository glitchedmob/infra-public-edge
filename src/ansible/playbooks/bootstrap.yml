---
- name: Bootstrap public edge node
  hosts: x86-vps-node-02
  become: true
  gather_facts: false
  vars:
    deployment_directory: /opt/infra-public-edge
  pre_tasks:
    - name: Load SSH private key once
      ansible.builtin.set_fact:
        ansible_ssh_private_key: "{{ ansible_ssh_private_key }}"
      no_log: true

    - name: Gather host facts
      ansible.builtin.setup:
  tasks:
    - name: Install bootstrap and deployment dependencies
      ansible.builtin.apt:
        name:
          - ca-certificates
          - python3-debian
          - rsync
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Configure Docker apt repository
      ansible.builtin.deb822_repository:
        name: docker
        types: deb
        uris: https://download.docker.com/linux/debian
        suites: "{{ ansible_facts['distribution_release'] }}"
        components: stable
        architectures: amd64
        signed_by: https://download.docker.com/linux/debian/gpg
        state: present
      register: docker_repository

    - name: Install Docker Engine and Compose
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: "{{ docker_repository.changed }}"

    - name: Create Docker configuration directory
      ansible.builtin.file:
        path: /etc/docker
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Configure container log rotation
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        owner: root
        group: root
        mode: "0644"
        content: |
          {
            "log-driver": "local",
            "log-opts": {
              "max-size": "10m",
              "max-file": "3"
            }
          }
      notify: Restart Docker

    - name: Create deployment directories
      ansible.builtin.file:
        path: "{{ deployment_directory }}{{ item.path }}"
        state: directory
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - { path: "", mode: "0755" }
        - { path: /config, mode: "0755" }
        - { path: /secrets, mode: "0700" }
        - { path: /data, mode: "0755" }

    - name: Configure persistent loopback address for private DNS
      ansible.builtin.copy:
        dest: /etc/network/interfaces.d/private-dns
        owner: root
        group: root
        mode: "0644"
        content: |
          auto lo:0
          iface lo:0 inet static
              address 10.255.255.1
              netmask 255.255.255.255

    - name: Bring up private DNS loopback address
      ansible.builtin.command:
        cmd: ifup lo:0
      register: private_dns_ifup
      changed_when: "'already configured' not in private_dns_ifup.stderr"
      failed_when: >-
        private_dns_ifup.rc != 0 and
        'ifup: interface lo:0 already configured' not in private_dns_ifup.stderr

    - name: Enable and start Docker
      ansible.builtin.systemd_service:
        name: docker
        enabled: true
        state: started

  handlers:
    - name: Restart Docker
      ansible.builtin.systemd_service:
        name: docker
        state: restarted
