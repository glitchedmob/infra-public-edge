---
- name: Deploy public edge applications
  hosts: x86-vps-node-02
  become: true
  gather_facts: false
  vars:
    deployment_directory: /opt/infra-public-edge
    compose_source: "{{ playbook_dir }}/compose"
    headscale_hostname: headscale.levizitting.com
    uptime_kuma_hostname: uptime.levizitting.com
    acme_email: me@levizitting.com
    # Shared application secret; preserve the existing SSM path across node replacements.
    ssm_headplane_cookie_secret_path: /homelab/x86-vps-node-01/headplane-cookie-secret
    compose_apps:
      - { name: traefik, uid: 10003 }
      - { name: headscale, uid: 10001, backup: true }
      - { name: headplane, uid: 10002, backup: true }
      - { name: uptime-kuma, uid: 1000, backup: true }
      - { name: coredns }
    compose_service_names: "{{ compose_apps | map(attribute='name') | list }}"
    backup_apps: "{{ compose_apps | selectattr('backup', 'defined') | selectattr('backup') | list }}"
    ssm_backup_prefix: /homelab/public-edge/backups
  module_defaults:
    community.docker.docker_compose_v2:
      project_src: "{{ deployment_directory }}"
      wait: true
      wait_timeout: 180
  pre_tasks:
    - name: Load SSH private key once
      ansible.builtin.set_fact:
        ansible_ssh_private_key: "{{ ansible_ssh_private_key }}"
      no_log: true

    - name: Load backup credentials once
      ansible.builtin.set_fact:
        backup_parameters: "{{ lookup('amazon.aws.ssm_parameter', ssm_backup_prefix, bypath=true, recursive=true) }}"
      no_log: true

    - name: Require configured backup credentials
      ansible.builtin.assert:
        that:
          - parameter_value | trim | length > 0
          - parameter_value | trim != 'CHANGEME'
        fail_msg: "Set SSM parameter {{ ssm_backup_prefix }}/{{ item }} before deploying"
      vars:
        parameter_value: "{{ backup_parameters.get(ssm_backup_prefix ~ '/' ~ item, '') }}"
      loop: >-
        {{ ['bucket-name', 'b2-account-id', 'b2-account-key'] +
           (backup_apps | map(attribute='name') | map('regex_replace', '$', '/restic-password') | list) }}
      no_log: true
  tasks:
    - name: Create application data directories
      ansible.builtin.file:
        path: "{{ deployment_directory }}/data/{{ item.name }}"
        state: directory
        owner: "{{ item.uid }}"
        group: "{{ item.uid }}"
        mode: "0700"
      when: item.uid is defined
      loop: "{{ compose_apps }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Create Headplane secret directory
      ansible.builtin.file:
        path: "{{ deployment_directory }}/secrets/headplane"
        state: directory
        owner: root
        group: "10002"
        mode: "0750"

    - name: Install Headplane cookie secret
      ansible.builtin.copy:
        content: "{{ lookup('amazon.aws.ssm_parameter', ssm_headplane_cookie_secret_path) }}"
        dest: "{{ deployment_directory }}/secrets/headplane/cookie_secret"
        owner: root
        group: "10002"
        mode: "0440"
      register: headplane_cookie_secret
      no_log: true
      diff: false
      notify: Restart headplane

    - name: Create private backup scratch directories outside the deployment tree
      ansible.builtin.file:
        path: "/var/lib/infra-public-edge-backups/{{ item.name }}"
        state: directory
        owner: "{{ item.uid }}"
        group: "{{ item.uid }}"
        mode: "0700"
      loop: "{{ backup_apps }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Create backup secret directories
      ansible.builtin.file:
        path: "{{ deployment_directory }}/secrets/backups/{{ item.name }}"
        state: directory
        owner: root
        group: "{{ item.uid }}"
        mode: "0750"
      loop: "{{ backup_apps }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Install per-application backup credentials
      ansible.builtin.copy:
        content: |
          RESTIC_REPOSITORY={{ ('b2:' ~ backup_parameters[ssm_backup_prefix ~ '/bucket-name'] ~ ':' ~ item.name) | quote }}
          B2_ACCOUNT_ID={{ backup_parameters[ssm_backup_prefix ~ '/b2-account-id'] | quote }}
          B2_ACCOUNT_KEY={{ backup_parameters[ssm_backup_prefix ~ '/b2-account-key'] | quote }}
          RESTIC_PASSWORD={{ backup_parameters[ssm_backup_prefix ~ '/' ~ item.name ~ '/restic-password'] | quote }}
        dest: "{{ deployment_directory }}/secrets/backups/{{ item.name }}/backup.env"
        owner: root
        group: "{{ item.uid }}"
        mode: "0440"
      loop: "{{ backup_apps }}"
      no_log: true
      diff: false

    - name: Stage and sync deployment files
      block:
        - name: Build local deployment tree
          delegate_to: localhost
          become: false
          check_mode: false
          diff: false
          block:
            # Temporary staging changes are not changes to the deployed configuration.
            - name: Create local staging directory
              ansible.builtin.tempfile:
                state: directory
                prefix: infra-public-edge-deploy-
              register: compose_staging
              changed_when: false

            - name: Create local service and configuration directories
              ansible.builtin.file:
                path: "{{ compose_staging.path }}/{{ item }}"
                state: directory
                mode: "0755"
              loop: >-
                {{ compose_service_names + ['backup', 'config/traefik/dynamic', 'config/headscale',
                   'config/headscale-dns', 'config/headplane', 'config/coredns'] }}
              changed_when: false

            - name: Stage Compose definitions
              ansible.builtin.copy:
                src: "{{ compose_source }}/{{ item }}"
                dest: "{{ compose_staging.path }}/{{ item }}"
                mode: "0644"
              loop: "{{ ['compose.yaml', 'backup/compose.yaml'] + (compose_service_names | map('regex_replace', '$', '/compose.yaml') | list) }}"
              changed_when: false

            - name: Stage Resticprofile configuration
              ansible.builtin.copy:
                src: "{{ compose_source }}/{{ item }}"
                dest: "{{ compose_staging.path }}/{{ item }}"
                mode: "0644"
              loop:
                - backup/profiles.yaml
                - headscale/profiles.yaml
                - headplane/profiles.yaml
                - uptime-kuma/profiles.yaml
              changed_when: false

            - name: Render application configuration locally
              ansible.builtin.template:
                src: "{{ compose_source }}/{{ item.src }}"
                dest: "{{ compose_staging.path }}/config/{{ item.dest }}"
                mode: "0644"
              loop:
                - { src: traefik/traefik.yaml.j2, dest: traefik/traefik.yaml }
                - { src: traefik/apps.yaml.j2, dest: traefik/dynamic/apps.yaml }
                - { src: headscale/config.yaml.j2, dest: headscale/config.yaml }
                - { src: headplane/config.yaml.j2, dest: headplane/config.yaml }
              loop_control:
                label: "{{ item.dest }}"
              changed_when: false

            - name: Stage DNS configuration without templating
              ansible.builtin.copy:
                src: "{{ compose_source }}/{{ item.src }}"
                dest: "{{ compose_staging.path }}/config/{{ item.dest }}"
                mode: "0644"
              loop:
                - { src: headscale/extra-records.json, dest: headscale-dns/extra-records.json }
                - { src: coredns/Corefile, dest: coredns/Corefile }
              loop_control:
                label: "{{ item.dest }}"
              changed_when: false

        - name: Sync deployment files and remove obsolete configuration
          ansible.posix.synchronize:
            src: "{{ compose_staging.path }}/"
            dest: "{{ deployment_directory }}/"
            use_ssh_args: true
            checksum: true
            times: false
            delete: true
            rsync_opts:
              - --chown=root:root
              - --chmod=D755,F644
              # Exclusions also protect these directories from deletion.
              - --exclude=/data/
              - --exclude=/secrets/
          register: compose_sync
          notify: Apply configuration changes
      always:
        - name: Remove local deployment staging directory
          ansible.builtin.file:
            path: "{{ compose_staging.path }}"
            state: absent
          when: compose_staging.path is defined
          delegate_to: localhost
          become: false
          check_mode: false
          changed_when: false

    - name: Apply configuration changes before checking application health
      ansible.builtin.meta: flush_handlers

    - name: Start applications and remove obsolete containers
      community.docker.docker_compose_v2:
        state: present
        remove_orphans: true

  handlers:
    - name: Restart backup services when profiles change
      listen: Apply configuration changes
      community.docker.docker_compose_v2:
        state: present
        recreate: always
        services: ["{{ item.name }}-backup"]
        dependencies: false
      loop: "{{ backup_apps }}"
      loop_control:
        label: "{{ item.name }}"
      when: >-
        ' backup/' in compose_sync.msg or
        ' ' ~ item.name ~ '/profiles.yaml' in compose_sync.msg

    # Release Traefik's old port-53 bindings before CoreDNS claims them.
    - name: Restart traefik
      listen: Apply configuration changes
      community.docker.docker_compose_v2:
        state: present
        recreate: always
        services: [traefik]
        dependencies: false
      when:
        - "'traefik' in compose_service_names"
        - "' config/traefik/' in compose_sync.msg or ' traefik/compose.yaml' in compose_sync.msg"

    - name: Restart coredns
      listen: Apply configuration changes
      community.docker.docker_compose_v2:
        state: present
        recreate: always
        services: [coredns]
      when:
        - "'coredns' in compose_service_names"
        - "' config/coredns/' in compose_sync.msg or ' coredns/compose.yaml' in compose_sync.msg"

    - name: Restart headscale
      listen: Apply configuration changes
      community.docker.docker_compose_v2:
        state: present
        recreate: always
        services: [headscale]
      when:
        - "'headscale' in compose_service_names"
        - >-
          ' config/headscale/' in compose_sync.msg or
          ' config/headscale-dns/' in compose_sync.msg

    - name: Restart headplane
      listen: Apply configuration changes
      community.docker.docker_compose_v2:
        state: present
        recreate: always
        services: [headplane]
        dependencies: false
      when:
        - "'headplane' in compose_service_names"
        - >-
          headplane_cookie_secret.changed or
          ' config/headplane/' in compose_sync.msg or
          ' config/headscale/' in compose_sync.msg or
          ' config/headscale-dns/' in compose_sync.msg
