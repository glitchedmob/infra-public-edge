---
- name: Preserve the current application data for rollback
  ansible.builtin.command:
    argv:
      - mv
      - --
      - "{{ deployment_directory }}/data/{{ restore_app.name }}"
      - "{{ restore_workspace.path }}/previous-{{ restore_app.name }}"
  changed_when: true

- name: Install the validated application data
  ansible.builtin.command:
    argv:
      - mv
      - --
      - "{{ restore_workspace.path }}/{{ restore_app.name }}"
      - "{{ deployment_directory }}/data/{{ restore_app.name }}"
  changed_when: true
