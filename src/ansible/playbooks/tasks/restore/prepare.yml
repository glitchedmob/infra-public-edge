---
- name: Resolve the requested snapshot in the application's repository
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - run
      - --rm
      - --no-deps
      - -T
      - "{{ restore_app.name }}-backup"
      - resticprofile
      - --stderr
      - snapshots
      - --json
      - "{{ restore_app.snapshot }}"
    chdir: "{{ deployment_directory }}"
  register: restore_snapshot_listing
  changed_when: false

- name: Require exactly one matching snapshot
  ansible.builtin.assert:
    that:
      - restore_snapshot_listing.stdout | from_json | length == 1
      - (restore_snapshot_listing.stdout | from_json | first).id is match('^[0-9a-f]{64}$')
    fail_msg: "Expected one snapshot for {{ restore_app.name }}:{{ restore_app.snapshot }}."

- name: Pin the resolved snapshot
  ansible.builtin.set_fact:
    restore_plan: >-
      {{ restore_plan + [{'name': restore_app.name,
         'snapshot': (restore_snapshot_listing.stdout | from_json | first).id,
         'time': (restore_snapshot_listing.stdout | from_json | first).time}] }}

- name: Show the selected snapshot
  ansible.builtin.debug:
    msg: "{{ restore_plan | last }}"

- name: Download the archive without touching application data
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - run
      - --rm
      - --no-deps
      - -T
      - "{{ restore_app.name }}-backup"
      - resticprofile
      - restore
      - "{{ (restore_plan | last).snapshot }}"
      - --target
      - "/scratch/restore/{{ restore_workspace.path | basename }}"
      - --verify
    chdir: "{{ deployment_directory }}"
  changed_when: true

- name: Extract and validate the archive in a separate data directory
  ansible.builtin.script:
    cmd: >-
      {{ (['files/restore-archive.py',
           backup_scratch_directory ~ '/' ~ restore_app.name ~ '/restore/' ~
           (restore_workspace.path | basename) ~ '/' ~ restore_app.name ~ '-backup.tar',
           restore_workspace.path ~ '/' ~ restore_app.name,
           restore_catalog[restore_app.name].database] +
          restore_catalog[restore_app.name].required_files) | map('quote') | join(' ') }}
    executable: python3
  changed_when: true

- name: Set restored data ownership
  ansible.builtin.file:
    path: "{{ restore_workspace.path }}/{{ restore_app.name }}"
    state: directory
    owner: "{{ restore_catalog[restore_app.name].uid }}"
    group: "{{ restore_catalog[restore_app.name].uid }}"
    recurse: true
