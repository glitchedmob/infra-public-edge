---
- name: Configure Tailscale with Headscale
  hosts: x86-vps-node-02
  become: true
  gather_facts: false
  pre_tasks:
    - name: Load SSH private key once
      ansible.builtin.set_fact:
        ansible_ssh_private_key: "{{ ansible_ssh_private_key }}"
      no_log: true

    - name: Gather host facts
      ansible.builtin.setup:
  tasks:
    - name: Assert Headscale login server is set
      ansible.builtin.assert:
        that:
          - tailscale_login_server is defined
          - tailscale_login_server | length > 0
        fail_msg: "Set tailscale_login_server for {{ inventory_hostname }}."

    - name: Assert SSM auth key path is set
      ansible.builtin.assert:
        that:
          - ssm_tailscale_authkey_path is defined
          - ssm_tailscale_authkey_path | length > 0
        fail_msg: "Set ssm_tailscale_authkey_path for {{ inventory_hostname }}."

    - name: Fetch Tailscale auth key from SSM
      ansible.builtin.set_fact:
        tailscale_authkey_value: "{{ lookup('amazon.aws.aws_ssm', ssm_tailscale_authkey_path) }}"
      no_log: true

    - name: Enable forwarding for exit-node traffic and the private DNS route
      ansible.posix.sysctl:
        name: "{{ item }}"
        value: "1"
        sysctl_file: /etc/sysctl.d/99-public-edge-routing.conf
        sysctl_set: true
        state: present
      loop:
        - net.ipv4.ip_forward
        - net.ipv6.conf.all.forwarding

    - name: Install and configure Tailscale
      ansible.builtin.include_role:
        name: artis3n.tailscale.machine
      vars:
        state: present
        tailscale_authkey: "{{ tailscale_authkey_value }}"
        tailscale_args: >-
          --login-server={{ tailscale_login_server }}
          --hostname={{ inventory_hostname }}
          --accept-routes
          --accept-dns=false
          --advertise-routes=10.255.255.1/32
          --advertise-exit-node
