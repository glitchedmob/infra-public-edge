---
- name: Configure Tailscale with Headscale
  hosts: x86-vps-node-02
  become: true
  gather_facts: false
  pre_tasks:
    - name: Load SSH private key once
      ansible.builtin.set_fact:
        ansible_ssh_private_key: "{{ ansible_ssh_private_key }}"
      no_log: true

    - name: Gather host facts
      ansible.builtin.setup:
  tasks:
    - name: Assert Headscale login server is set
      ansible.builtin.assert:
        that:
          - tailscale_login_server is defined
          - tailscale_login_server | length > 0
        fail_msg: "Set tailscale_login_server for {{ inventory_hostname }}."

    - name: Assert SSM auth key path is set
      ansible.builtin.assert:
        that:
          - ssm_tailscale_authkey_path is defined
          - ssm_tailscale_authkey_path | length > 0
        fail_msg: "Set ssm_tailscale_authkey_path for {{ inventory_hostname }}."

    - name: Fetch Tailscale auth key from SSM
      ansible.builtin.set_fact:
        tailscale_authkey_value: "{{ lookup('amazon.aws.aws_ssm', ssm_tailscale_authkey_path) }}"
      no_log: true

    - name: Enable forwarding for exit-node traffic and the private DNS route
      ansible.posix.sysctl:
        name: "{{ item }}"
        value: "1"
        sysctl_file: /etc/sysctl.d/99-public-edge-routing.conf
        sysctl_set: true
        state: present
      loop:
        - net.ipv4.ip_forward
        - net.ipv6.conf.all.forwarding

    - name: Install and configure Tailscale
      ansible.builtin.include_role:
        name: artis3n.tailscale.machine
      vars:
        state: present
        tailscale_authkey: "{{ tailscale_authkey_value }}"
        tailscale_args: >-
          --login-server={{ tailscale_login_server }}
          --hostname={{ inventory_hostname }}
          --accept-routes
          --accept-dns=false
          --advertise-routes=10.255.255.1/32
          --advertise-exit-node

    # Exit-node DNS uses the host resolver. Deploy CoreDNS before switching it.
    - name: Wait for the private DNS listener before changing host DNS
      ansible.builtin.wait_for:
        host: 10.255.255.1
        port: 53
        timeout: 30

    - name: Create host resolver configuration directory
      ansible.builtin.file:
        path: /etc/systemd/resolved.conf.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Route the private domain through CoreDNS
      ansible.builtin.copy:
        dest: /etc/systemd/resolved.conf.d/90-private-dns.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by infra-public-edge. Public DNS is routed through the uplink.
          [Resolve]
          DNS=
          DNS=10.255.255.1
          FallbackDNS=
          Domains=
          Domains=~levizitting.com
          DNSStubListener=yes
          DNSSEC=no
          DNSOverTLS=no
      register: host_dns_config

    # Stage configuration before installation so the first start uses it.
    - name: Install the host resolver
      ansible.builtin.apt:
        name: systemd-resolved
        state: present

    # ifupdown manages the uplink, so persist resolved's per-link DNS separately.
    - name: Configure public DNS on the uplink across boots and resolver restarts
      ansible.builtin.copy:
        dest: /etc/systemd/system/public-edge-dns.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Public DNS routing for the edge host
          Requires=systemd-resolved.service
          Wants=network-online.target
          After=systemd-resolved.service network-online.target
          PartOf=systemd-resolved.service

          [Service]
          Type=oneshot
          ExecStart=/usr/bin/resolvectl dns {{ ansible_facts.default_ipv4.interface }} \
              1.1.1.1 1.0.0.1 2606:4700:4700::1111 2606:4700:4700::1001
          ExecStart=/usr/bin/resolvectl domain {{ ansible_facts.default_ipv4.interface }} \
              ~. ~headscale.levizitting.com ~public-edge.levizitting.com ~{{ inventory_hostname }}.levizitting.com
          RemainAfterExit=yes

          [Install]
          WantedBy=systemd-resolved.service
      register: public_dns_unit

    - name: Enable the host resolver and apply configuration changes
      ansible.builtin.systemd_service:
        name: systemd-resolved
        daemon_reload: "{{ public_dns_unit.changed }}"
        enabled: true
        state: "{{ 'restarted' if host_dns_config.changed else 'started' }}"

    - name: Enable and apply public DNS routing
      ansible.builtin.systemd_service:
        name: public-edge-dns
        enabled: true
        state: "{{ 'restarted' if public_dns_unit.changed else 'started' }}"

    - name: Use the managed host DNS stub for exit-node queries
      ansible.builtin.file:
        src: /run/systemd/resolve/stub-resolv.conf
        dest: /etc/resolv.conf
        state: link
        force: true
        owner: root
        group: root
