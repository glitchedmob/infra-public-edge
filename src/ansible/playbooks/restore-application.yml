---
- name: Restore selected public edge applications
  hosts: x86-vps-node-02
  become: true
  gather_facts: false
  vars_files:
    - vars/restore-applications.yml
  vars:
    deployment_directory: /opt/infra-public-edge
    backup_scratch_directory: /var/lib/infra-public-edge-backups
    restore_selected_names: "{{ restore_selections | map(attribute='name') | list }}"
    restore_affected_apps: >-
      {{ (restore_selected_names + (['headplane'] if 'headscale' in restore_selected_names else [])) | unique | list }}
    restore_backup_services: "{{ restore_affected_apps | map('regex_replace', '$', '-backup') | list }}"
  module_defaults:
    community.docker.docker_compose_v2:
      project_src: "{{ deployment_directory }}"
      dependencies: false
      wait: true
      wait_timeout: 180
  pre_tasks:
    - name: Parse and validate restore selections before contacting the node
      ansible.builtin.import_tasks: tasks/restore/parse.yml

    - name: Reject check mode for the restore operation
      ansible.builtin.assert:
        that: not ansible_check_mode
        fail_msg: "Restore does not support --check. No data has been changed."

    - name: Load SSH private key once
      ansible.builtin.set_fact:
        ansible_ssh_private_key: "{{ ansible_ssh_private_key }}"
      when: ssm_private_key_path is defined
      no_log: true

    - name: Read current application and backup container states
      ansible.builtin.command:
        argv: [docker, compose, ps, --all, --format, json]
        chdir: "{{ deployment_directory }}"
      register: restore_container_status
      changed_when: false

    - name: Record existing containers
      ansible.builtin.set_fact:
        restore_containers: "{{ restore_container_status.stdout_lines | map('from_json') | list }}"

    - name: Require an already-deployed application and backup service
      ansible.builtin.assert:
        that: item in restore_containers | map(attribute='Service') | list
        fail_msg: "Missing container for {{ item }}. Run deployment before restoring applications."
      loop: "{{ restore_affected_apps + restore_backup_services }}"

    - name: Remember which services were running
      ansible.builtin.set_fact:
        restore_running_services: >-
          {{ restore_containers | selectattr('State', 'equalto', 'running') | map(attribute='Service') | list }}
        restore_plan: []
        restore_cutover_started: false

    - name: Inspect current data directories
      ansible.builtin.stat:
        path: "{{ deployment_directory }}/data/{{ item }}"
        follow: false
      loop: "{{ restore_selected_names }}"
      register: restore_data_directories

    - name: Require real application data directories
      ansible.builtin.assert:
        that:
          - item.stat.isdir | default(false)
          - not (item.stat.islnk | default(false))
        fail_msg: "Expected a data directory for {{ item.item }}. Run deployment before restoring applications."
      loop: "{{ restore_data_directories.results }}"
      loop_control:
        label: "{{ item.item }}"

  tasks:
    - name: Create private staging and rollback space on the data filesystem
      ansible.builtin.tempfile:
        state: directory
        path: "{{ deployment_directory }}/data"
        prefix: .restore-
      register: restore_workspace

    - name: Prepare and restore application data
      block:
        - name: Stop affected backup schedulers
          community.docker.docker_compose_v2:
            state: stopped
            wait: false
            services: "{{ restore_backup_services }}"

        - name: Download and validate every requested backup before stopping applications
          ansible.builtin.include_tasks: tasks/restore/prepare.yml
          loop: "{{ restore_selections }}"
          loop_control:
            loop_var: restore_app
            label: "{{ restore_app.name }}:{{ restore_app.snapshot }}"

        - name: Show the resolved restore plan
          ansible.builtin.debug:
            var: restore_plan

        - name: Mark the beginning of the application maintenance window
          ansible.builtin.set_fact:
            restore_cutover_started: true

        - name: Stop affected applications including Headplane when restoring Headscale
          community.docker.docker_compose_v2:
            state: stopped
            wait: false
            services: "{{ restore_affected_apps }}"

        - name: Replace application directories while preserving the original data
          ansible.builtin.include_tasks: tasks/restore/install.yml
          loop: "{{ restore_plan }}"
          loop_control:
            loop_var: restore_app
            label: "{{ restore_app.name }}"

        - name: Recreate applications and check health in dependency order
          community.docker.docker_compose_v2:
            state: present
            recreate: always
            services: ["{{ item }}"]
          loop: "{{ restore_catalog.keys() | list }}"
          when: >-
            item in restore_selected_names or
            (item in restore_affected_apps and item in restore_running_services)

        - name: Recreate previously running backup schedulers with the restored data mounts
          community.docker.docker_compose_v2:
            state: present
            recreate: always
            services: "{{ restore_backup_services | intersect(restore_running_services) }}"
          when: restore_backup_services | intersect(restore_running_services) | length > 0

      rescue:
        - name: Keep affected services stopped after a cutover failure
          community.docker.docker_compose_v2:
            state: stopped
            wait: false
            services: "{{ restore_affected_apps + restore_backup_services }}"
          when: restore_cutover_started
          register: restore_stop_result
          failed_when: false

        - name: Resume previously running backups when application data was not changed
          community.docker.docker_compose_v2:
            state: present
            services: "{{ restore_backup_services | intersect(restore_running_services) }}"
          when:
            - not restore_cutover_started
            - restore_backup_services | intersect(restore_running_services) | length > 0

        - name: Report the failed restore and recovery location
          ansible.builtin.fail:
            msg: >-
              Restore failed: {{ ansible_failed_result.msg | default('See the failed task above.') }}
              {{ 'Cutover began; affected apps and backups were requested to stop. Verify their state before recovery.'
                 if restore_cutover_started else 'Applications and their live data were not changed.' }}
              Staged data and any previous-<app> rollback directories are in {{ restore_workspace.path }}.
              Do not resume backups or deploy over a failed cutover until the application data is verified.

    - name: Remove downloaded archives after successful recovery
      ansible.builtin.file:
        path: "{{ backup_scratch_directory }}/{{ item }}/restore/{{ restore_workspace.path | basename }}"
        state: absent
      loop: "{{ restore_selected_names }}"

    - name: Report restored snapshots and preserved data
      ansible.builtin.debug:
        msg:
          restored: "{{ restore_plan }}"
          health: "Restored applications passed their Compose health checks."
          rollback_directory: "{{ restore_workspace.path }}"
          rollback_note: "Original data is in previous-<app> directories. Keep it until application contents have been verified."
