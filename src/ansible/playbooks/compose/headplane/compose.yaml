services:
  headplane-backup:
    extends:
      file: ../backup/compose.yaml
      service: backup
    user: "10002:10002"
    environment:
      BACKUP_APP: headplane
    volumes:
      - type: bind
        source: .
        target: /etc/backup
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../data/headplane
        target: /source
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../secrets/backups/headplane
        target: /run/secrets/backup
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /var/lib/infra-public-edge-backups/headplane
        target: /scratch
        bind:
          create_host_path: false

  headplane:
    image: ghcr.io/tale/headplane:0.7.1
    user: "10002:10002"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    networks:
      - headscale
    depends_on:
      headscale:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/hp_healthcheck"]
      interval: 10s
      timeout: 6s
      start_period: 30s
      retries: 6
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m,mode=1777
    volumes:
      - type: bind
        source: ../config/headplane
        target: /etc/headplane
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../secrets/headplane
        target: /run/secrets/headplane
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../config/headscale
        target: /etc/headscale
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../config/headscale-dns
        target: /etc/headscale-dns
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../data/headplane
        target: /var/lib/headplane
        read_only: false
        bind:
          create_host_path: false
