services:
  coredns:
    image: rancher/mirrored-coredns-coredns:1.14.4
    user: "10004:10004"
    command: ["-conf", "/etc/coredns/Corefile"]
    read_only: true
    cap_drop:
      - ALL
    # The image's capability-marked binary requires this bounding-set entry.
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    mem_limit: 100m
    networks:
      - coredns
    volumes:
      - type: bind
        source: ../config/coredns
        target: /etc/coredns
        read_only: true
        bind:
          create_host_path: false
