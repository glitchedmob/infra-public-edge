name: CI

on:
  pull_request:

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      ansible: ${{ steps.changed-files.outputs.ansible_any_changed }}
      k8s: ${{ steps.changed-files.outputs.k8s_any_changed }}
      terraform: ${{ steps.changed-files.outputs.terraform_any_changed }}
    steps:
      - uses: actions/checkout@v7

      - id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files_yaml: |
            ansible:
              - src/ansible/**
              - .github/workflows/ansible-lint.yml
              - .github/workflows/ci.yml
            k8s:
              - src/k8s/**
              - .github/workflows/flux-diff.yml
              - .github/workflows/ci.yml
            terraform:
              - src/tf/**
              - .github/workflows/tf-plan.yml
              - .github/workflows/tf-plan-apply.yml
              - .github/workflows/ci.yml

  ansible-lint:
    if: needs.changes.outputs.ansible == 'true'
    needs: changes
    uses: glitchedmob/infra-gha/.github/workflows/ansible-lint.yml@v0.7.4
    with:
      working-directory: src/ansible

  terraform-validate:
    if: needs.changes.outputs.terraform == 'true'
    needs: changes
    uses: glitchedmob/infra-gha/.github/workflows/tf-validate.yml@v0.7.4
    with:
      init-backend: false

  terraform-plan:
    if: needs.changes.outputs.terraform == 'true' && needs.terraform-validate.result == 'success'
    needs:
      - changes
      - terraform-validate
    uses: glitchedmob/infra-gha/.github/workflows/tf-plan-apply.yml@v0.7.4
    with:
      plan-only: true
    secrets:
      envrc_content: |
        export TF_VAR_vultr_api_token="${{ secrets.TF_VAR_vultr_api_token }}"
        export TF_VAR_cloudflare_api_token="${{ secrets.TF_VAR_cloudflare_api_token }}"
        export TF_VAR_b2_application_key_id="${{ secrets.TF_VAR_b2_application_key_id }}"
        export TF_VAR_b2_application_key="${{ secrets.TF_VAR_b2_application_key }}"
      aws_role_arn: ${{ secrets.AWS_ROLE_ARN }}
      output_encryption_key: ${{ secrets.OUTPUT_ENCRYPTION_KEY }}

  flux-diff:
    if: needs.changes.outputs.k8s == 'true'
    needs: changes
    uses: ./.github/workflows/flux-diff.yml
    secrets: inherit

  ci-checks:
    name: CI checks
    if: always()
    needs:
      - changes
      - ansible-lint
      - terraform-validate
      - terraform-plan
      - flux-diff
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe
        with:
          allowed-skips: ansible-lint, terraform-validate, terraform-plan, flux-diff
          jobs: ${{ toJSON(needs) }}
