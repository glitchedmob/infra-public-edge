name: Ansible Auto

on:
  push:
    branches: [main]
    paths:
      - src/ansible/playbooks/apply.yml
      - src/ansible/playbooks/manifests/**
      - src/ansible/playbooks/deploy.yml
      - src/ansible/playbooks/compose/**
      - .github/workflows/ansible-auto.yml

# Use public SSH until Tailscale connectivity is ready.

permissions:
  contents: read
  id-token: write

jobs:
  run:
    uses: glitchedmob/infra-gha/.github/workflows/ansible-auto.yml@v0.7.4
    with:
      working-directory: src/ansible
      initialize-terraform: true
      terraform-working-directory: src/tf
      trigger-map: >-
        {"apply.yml": ["src/ansible/playbooks/apply.yml", "src/ansible/playbooks/manifests"],
         "deploy.yml": ["src/ansible/playbooks/deploy.yml", "src/ansible/playbooks/compose/"]}
      headscale-login-server: ''
    secrets:
      envrc_content: 'export EDGE_CONNECTION_MODE=public'
      aws_role_arn: ${{ secrets.AWS_ROLE_ARN }}
      output_encryption_key: ${{ secrets.OUTPUT_ENCRYPTION_KEY }}
      headscale_auth_key: ''